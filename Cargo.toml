[package]
name = "kamenx"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking"] }
indicatif = "0.18.6"
flate2 = "1.1.10"
duckdb = {version = "1.10506.0", features = ["bundled"]}
serde = {version="1.0.229", features=["derive"]}
rs-trafilatura = "0.2.2"
crossbeam-channel = "0.5.17"
axum = "0.8.9"
tower-http = { version = "0.6", features = ["cors"] }
tokio = {version="1.53.3", features=["rt-multi-thread", "macros", "net"]}
serde_json = "1.0"
wordnet-lemmatizer = { version = "0.1", default-features = false }
lede = "0.5.1"
